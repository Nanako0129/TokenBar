name: CI

# The app build/test pipeline. Skips landing-only changes — those have their
# own pages.yml deploy and don't touch the Rust/Swift app.
on:
  push:
    branches: [main]
    paths-ignore: ['landing/**']
  pull_request:
    paths-ignore: ['landing/**']

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate knowledge contracts
        run: python3 scripts/check_knowledge.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust staticlib
        run: cargo build --release

      - name: Build Swift package
        run: swift build

      - name: Core logic selftest
        # Pace copy and Format's date output are localized, and several
        # assertions compare against the English text. Pin the language so the
        # result never depends on the runner's locale.
        run: swift run TokenBar --selftest -AppleLanguages "(en)"

      - name: FFI smoke test
        run: swift run TokenBar --smoke

      # Every step above compiles the debug configuration, so nothing here can
      # see a `#if DEBUG` boundary break. The release configuration was first
      # compiled by scripts/bundle.sh, which only runs from release.yml on a
      # `v*` tag — so a call to a DEBUG-only symbol stayed green through local
      # gates, PR CI and merge, and failed only after the tag was already
      # pushed. PR #137 hit exactly that.
      #
      # Push-only, not on pull_request: this class of break needs someone to
      # touch a conditional-compilation boundary, which is rare, and a release
      # build is slow enough that paying for it on every PR iteration is a bad
      # trade. Running it on main still guarantees the tag is never the first
      # time this configuration is compiled.
      - name: Build Swift package (release configuration)
        if: github.event_name == 'push'
        run: swift build -c release

      # Every step above runs the bare executable, where
      # `Bundle.main.bundleIdentifier` is nil. A value keyed on that is literal
      # where the suite looks and something else where it ships — #146 wrote
      # three source scans against exactly that and all three were escaped,
      # because the gap is not in the source text. Running the suite from the
      # bundled binary is what observes it.
      #
      # Same push-only trade as the step above, and it reuses that release
      # build, so the marginal cost here is the bundling and one suite run.
      #
      # `make selftest-bundled` and not an inline command: the throwaway bundle
      # identifier is the point (see the Makefile), and a second copy of it here
      # is a second place to get it wrong.
      - name: Selftest from the bundled release binary
        if: github.event_name == 'push'
        run: make selftest-bundled
