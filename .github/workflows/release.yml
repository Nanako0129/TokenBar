name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write   # the badge step dispatches update-install-count.yml

jobs:
  release:
    # Xcode 27 (the macOS 27 SDK): the dashboard's glass panel is built on
    # NSStatusItem.expandedInterfaceDelegate, which older SDKs do not have.
    # macos-26 carries Xcode 26.6 and fails to compile it; compiling the panel
    # out instead would ship a release without it (see #343 in
    # GlassBackground.swift). `xcode-27` is a GitHub public-preview image as of
    # 2026-09 — expect occasional queueing.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # The notes are checked here, not only in CI, because CI does not run on
      # tags: ci.yml triggers on pushes to main and on pull requests, so a tag
      # cut from an unreviewed commit — or pushed before its main run finishes —
      # would reach publication unchecked. `release_notes.sh` refuses a missing
      # or empty source on its own, but a nonempty pair whose figures disagree
      # would otherwise ship to the release page and the appcast with nothing
      # in between. (The legacy Tauri latest.json is frozen and carries no
      # notes from this release.)
      #
      # First step, before the toolchain: a tag with bad notes should fail in
      # seconds rather than after a twenty-minute build.
      - name: Check the release notes for this tag
        run: python3 scripts/check_release_notes.py "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          scripts/bundle.sh "$VERSION" "$BUILD"

      - name: Archive
        run: |
          tar -czf "TokenBar.app.tar.gz" -C dist "TokenBar.app"
          shasum -a 256 "TokenBar.app.tar.gz" | awk '{print $1}' > sha256.txt
          echo "SHA256=$(cat sha256.txt)" >> "$GITHUB_ENV"

      # release-notes.txt: plain text for the Sparkle dialog and appcast.
      # release-notes.md: markdown for the GitHub release page, with PR
      # links, contributor credit, and GitHub's New Contributors tail.
      #
      # Both bodies are hand-written at release-notes/<tag>.{txt,md} and this
      # step only assembles them with the GitHub-derived credit line and tail.
      # A missing file fails here rather than falling back, which is the point:
      # the previous scheme read an unversioned override that a completed
      # release left behind, armed to republish itself on the next tag.
      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release_notes.sh

      - name: Sign and build appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_ed.key
          scripts/make_appcast.sh "TokenBar.app.tar.gz" "$VERSION" "$GITHUB_REF_NAME" /tmp/sparkle_ed.key release-notes.txt
          rm -f /tmp/sparkle_ed.key

      # Legacy Tauri manifest. The old Tauri app's updater endpoint
      # (github.com/Nanako0129/TokenBar/releases/latest/download/latest.json)
      # resolves to this repo, and a Tauri install upgrades itself by fetching
      # that file. It is frozen: `scripts/legacy/tauri-latest.json` is the
      # v1.20.2 manifest byte for byte, pointing at v1.20.2's archive with the
      # signature made for it, so a Tauri install still lands on a native build
      # and Sparkle takes over from there. Every stable release re-uploads the
      # same file so `releases/latest` keeps serving it. Nothing is signed here
      # any more, so neither the Tauri signing key nor the Node-based signer
      # is part of the release (REN-R0B). The literal digest below fails the
      # release if the frozen file ever changes, including by a scripted
      # rename.
      - name: Legacy Tauri manifest (stable only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          echo "c39de81d85baa99351532952b88ef21074dc7633fc54aab90a2b81873426c0bf  scripts/legacy/tauri-latest.json" | shasum -a 256 -c -
          cp scripts/legacy/tauri-latest.json latest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          ASSETS="TokenBar.app.tar.gz"
          case "$VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease";;
            *) ASSETS="$ASSETS latest.json";;  # frozen legacy Tauri manifest
          esac
          NOTES="release-notes.md"
          [[ -s "$NOTES" ]] || NOTES="release-notes.txt"
          gh release create "$GITHUB_REF_NAME" \
            $ASSETS \
            --title "TokenBar $VERSION" \
            --notes-file "$NOTES" $PRERELEASE_FLAG

      - name: Publish appcast to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add appcast.xml
          git commit -m "chore(release): appcast for $GITHUB_REF_NAME" || exit 0
          git push origin main

      # `on: release` never fires downstream for GITHUB_TOKEN-created
      # releases (recursion guard) — dispatch the badge refresh explicitly.
      - name: Refresh install-count badge
        # Non-critical chore — never let it gate the Homebrew cask bump below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-install-count.yml --ref main

      # Prereleases ship via the Sparkle beta channel only — no cask bump.
      - name: Bump Homebrew cask (tokenbar)
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          umask 077
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > /tmp/tap_deploy_key
          export GIT_SSH_COMMAND="ssh -i /tmp/tap_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:Nanako0129/homebrew-tokenbar.git /tmp/tap
          cat > "/tmp/tap/Casks/tokenbar.rb" <<CASK
          cask "tokenbar" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/Nanako0129/TokenBar/releases/download/v#{version}/TokenBar.app.tar.gz"
            name "TokenBar"
            desc "Menubar dashboard for local AI token usage"
            homepage "https://github.com/Nanako0129/TokenBar"

            auto_updates true
            depends_on macos: :sonoma
            depends_on arch: :arm64

            app "TokenBar.app"

            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/TokenBar.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.nyanako.tokenbar",
              "~/Library/Caches/com.nyanako.tokenbar",
              "~/Library/Preferences/com.nyanako.tokenbar.plist",
              "~/Library/Preferences/com.nyanako.tokenbar.beta.plist",
            ]
          end
          CASK
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "tokenbar $VERSION"
          git push
          rm -f /tmp/tap_deploy_key
