name: Windows storage E1 verification

on:
  push:
    branches: [verify/windows-storage-e1-ci]

permissions:
  contents: read

env:
  CANDIDATE_SHA: 37e4804fce6b29d575c060d16b900397f3e55ea2
  CANDIDATE_STORAGE_BLOB: af9aa11f26c94a40d1912b53bca3eb183a7aab7d
  CANDIDATE_VENDOR_SHA: 5b5f500d3a8abe66ab5fa44b18f4fc1aaee53947
  RUST_TOOLCHAIN: 1.97.1

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
          - label: arm64
            runner: windows-11-arm
    name: Windows ${{ matrix.label }} runtime
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v6
        with:
          path: harness

      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          submodules: recursive

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy
          rustup override set $env:RUST_TOOLCHAIN
        working-directory: candidate

      - name: Verify architecture and candidate identity
        shell: pwsh
        run: |
          "ARCH=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          "HEAD=$(git rev-parse HEAD)"
          "TREE=$(git rev-parse 'HEAD^{tree}')"
          "STORAGE_BLOB=$(git hash-object crates/tb_core_ffi/src/agent_storage_windows.rs)"
          "VENDOR=$(git -C vendor/tokscale-core rev-parse HEAD)"
          if ((git rev-parse HEAD) -ne $env:CANDIDATE_SHA) { throw 'candidate SHA mismatch' }
          if ((git hash-object crates/tb_core_ffi/src/agent_storage_windows.rs) -ne $env:CANDIDATE_STORAGE_BLOB) { throw 'storage blob mismatch' }
          if ((git -C vendor/tokscale-core rev-parse HEAD) -ne $env:CANDIDATE_VENDOR_SHA) { throw 'vendor SHA mismatch' }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          $vendorDirty = @(git -C vendor/tokscale-core status --porcelain=v1 --untracked-files=all)
          "SUPERPROJECT_STATUS_COUNT=$($dirty.Count)"
          $dirty | ForEach-Object { "SUPERPROJECT_STATUS=$_" }
          "VENDOR_STATUS_COUNT=$($vendorDirty.Count)"
          $vendorDirty | ForEach-Object { "VENDOR_STATUS=$_" }
          if ($dirty.Count -ne 0 -or $vendorDirty.Count -ne 0) { throw 'candidate checkout is dirty' }
        working-directory: candidate

      - name: Full Rust workspace tests
        run: cargo test --workspace --release --locked
        working-directory: candidate

      - name: Focused Windows storage tests
        run: cargo test --workspace --release --locked agent_storage_windows
        working-directory: candidate

      - name: Scoped tb_core_ffi Clippy
        run: cargo clippy -p tb_core_ffi --all-targets --no-deps
        working-directory: candidate

      - name: Copy mutation runner
        if: matrix.label == 'x64'
        shell: pwsh
        run: Copy-Item harness/scripts/windows-storage-e1-mutations.ps1 candidate/windows-storage-e1-mutations.ps1

      - name: Seven production mutations
        if: matrix.label == 'x64'
        shell: pwsh
        run: ./windows-storage-e1-mutations.ps1
        working-directory: candidate

      - name: Workspace Clippy baseline observation
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
        working-directory: candidate

      - name: Confirm exact restore
        if: always() && matrix.label == 'x64'
        shell: pwsh
        run: |
          Remove-Item windows-storage-e1-mutations.ps1 -ErrorAction SilentlyContinue
          if ((git hash-object crates/tb_core_ffi/src/agent_storage_windows.rs) -ne $env:CANDIDATE_STORAGE_BLOB) { throw 'mutation runner changed candidate bytes' }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          $vendorDirty = @(git -C vendor/tokscale-core status --porcelain=v1 --untracked-files=all)
          "FINAL_STATUS_COUNT=$($dirty.Count)"
          $dirty | ForEach-Object { "FINAL_STATUS=$_" }
          "FINAL_VENDOR_STATUS_COUNT=$($vendorDirty.Count)"
          $vendorDirty | ForEach-Object { "FINAL_VENDOR_STATUS=$_" }
          if ($dirty.Count -ne 0 -or $vendorDirty.Count -ne 0) { throw 'mutation runner left candidate dirty' }
        working-directory: candidate
